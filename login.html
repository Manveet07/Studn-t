<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Studn't</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/auth-shared.css">
  <link rel="stylesheet" href="css/pages/loading.css">
</head>
<body class="pd-page auth-page">

  <div id="pd-cursor"></div>
  <div id="pd-cursor-glow"></div>

  <canvas id="auth-bg-canvas"></canvas>

  <main class="auth-container">
    <div class="auth-glass-card">

      <div class="auth-header">
        <a class="auth-back-btn" id="auth-back" href="index.html" data-transition>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back
        </a>
        <a href="index.html" class="glow-mark" style="margin: 0 auto var(--space-4) auto;" data-transition>
          <span class="glow-mark__text">?</span>
        </a>
        <p class="auth-eyebrow">WELCOME BACK</p>
        <h1 class="auth-title">Log In</h1>
      </div>

      <!-- Login Form -->
      <form id="login-form" autocomplete="off" onsubmit="return false;">
        <div class="pd-field">
          <label class="pd-field__label" for="login-identifier">Username or Email</label>
          <input class="pd-field__input" type="text" id="login-identifier" placeholder="Enter your username or email" autocomplete="username">
        </div>

        <div class="pd-field pd-field--password">
          <label class="pd-field__label" for="login-password">Password</label>
          <input class="pd-field__input" type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="pd-field__password-toggle" id="login-pw-toggle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div class="pd-errors" id="login-errors"></div>

        <button type="submit" class="pd-btn pd-btn--cta" style="width:100%; margin-top: var(--space-2);" id="login-submit">Log In →</button>
      </form>

      <!-- Past Profiles Quick Login -->
      <div class="auth-past-profiles" id="past-profiles-section" style="display:none">
        <div class="auth-past-profiles__title">Jump back in</div>
        <div class="auth-past-profiles__list" id="past-profiles-list"></div>
      </div>

      <div style="text-align:center; margin-top: var(--space-5);">
        <span style="font-size:0.8rem; color: var(--text-tertiary);">Don't have an account? </span>
        <a href="signup.html" style="font-size:0.8rem; color: var(--accent-orange); font-weight:500; text-decoration:none;">Sign Up</a>
      </div>
    </div>
  </main>

  <script src="js/transitions.js"></script>
  <script type="module" src="js/pages/login.js"></script>
  <script type="module" src="js/cursor.js"></script>
</body>
</html>
