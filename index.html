<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studn't — Get Help From People Who've Been There</title>
  <meta name="description" content="A student peer-help platform where doubts float to the right people.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/landing.css">
</head>
<body class="pd-page">

  <!-- Custom Cursor with Glow -->
  <div id="pd-cursor"></div>
  <div id="pd-cursor-glow"></div>

  <!-- Full-screen canvas: spheres + particles + stars + cursor glow -->
  <canvas id="landing-sphere-canvas"></canvas>

  <!-- Nav Bar (no login/signup) -->
  <nav class="landing-nav">
    <a class="landing-nav__brand" href="index.html">
      <div class="glow-mark">
        <span class="glow-mark__text">?</span>
      </div>
      <span class="landing-nav__name">Studn't</span>
    </a>
    <div class="landing-nav__links">
      <a href="#" class="landing-nav__link">About</a>
      <a href="#" class="landing-nav__link">How It Works</a>
      <a href="#" class="landing-nav__link">Contact</a>
    </div>
  </nav>

  <!-- Hero Content -->
  <main class="landing-hero">
    <p class="landing-eyebrow">STUDENT PEER HELP</p>
    <h1 class="landing-hero-title">
      Help that floats<br>to the right people.
    </h1>
    <p class="landing-hero-desc">
      Post a doubt, get matched by skill, and help others in return.
      No more shouting into the void — your question finds the one person who knows.
    </p>

    <div class="landing-cta-group">
      <button id="landing-get-started" class="uiverse-btn pd-btn--magnetic">
        <div class="uiverse-btn__wrapper">
          <span>Get Started</span>
          <div class="uiverse-btn__circle uiverse-btn__circle--1"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--2"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--3"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--4"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--5"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--6"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--7"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--8"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--9"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--10"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--11"></div>
          <div class="uiverse-btn__circle uiverse-btn__circle--12"></div>
        </div>
      </button>
    </div>
  </main>

  <!-- Login/Signup Choice Popup -->
  <div class="choice-popup" id="choice-popup" style="display:none">
    <div class="choice-popup__backdrop" id="choice-backdrop"></div>
    <div class="choice-popup__card">
      <div class="choice-popup__title">Welcome to Studn't</div>
      <div class="choice-popup__subtitle">How would you like to continue?</div>
      <div class="choice-popup__actions">
        <button class="choice-popup__btn choice-popup__btn--login" id="choice-login">
          <div class="choice-popup__btn-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          </div>
          <div class="choice-popup__btn-text">
            <div class="choice-popup__btn-label">Log In</div>
            <div class="choice-popup__btn-desc">I already have an account</div>
          </div>
        </button>
        <button class="choice-popup__btn choice-popup__btn--signup" id="choice-signup">
          <div class="choice-popup__btn-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          </div>
          <div class="choice-popup__btn-text">
            <div class="choice-popup__btn-label">Sign Up</div>
            <div class="choice-popup__btn-desc">Create a new account</div>
          </div>
        </button>
      </div>
      <button class="choice-popup__close" id="choice-close">&times;</button>
    </div>
  </div>

  <!-- Bubble Transition Overlay -->
  <div class="bubble-transition" id="bubble-transition" style="display:none">
    <div class="bubble-transition__orb" id="transition-orb"></div>
  </div>

  <script type="module" src="js/pages/landing.js"></script>
  <script type="module" src="js/cursor.js"></script>

</body>
</html>
