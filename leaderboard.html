<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Studn't</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/leaderboard-v3.css">
</head>
<body class="pd-page lb-page-v4">

  <div id="pd-cursor"></div>
  <div id="pd-cursor-glow"></div>

  <!-- Space + planet background -->
  <div class="lb-space-bg">
    <div class="lb-planet"></div>
    <canvas id="leaderboard-bg-canvas"></canvas>
  </div>

  <div class="app-shell lb-shell">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <a href="index.html" class="sidebar__brand" data-transition>
        <span class="glow-mark__text">?</span>
      </a>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="dashboard.html" title="Dashboard" data-transition>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </a>
        <a class="sidebar__link sidebar__link--active" href="leaderboard.html" title="Leaderboard" data-transition>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.34"/><path d="M18 14.66V17c0 .55-.45 1-1 1h-2c-.55 0-1-.45-1-1v-2.34"/><path d="M6 9h12a2 2 0 0 1 2 2v1a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-1a2 2 0 0 1 2-2Z"/></svg>
        </a>
        <a class="sidebar__link" href="profile.html" title="Profile" data-transition>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
      </nav>
      <div class="sidebar__spacer"></div>
      <div class="sidebar__avatar" id="sidebar-avatar" title="Profile">
        <span id="sidebar-avatar-letter">?</span>
      </div>
      <button class="sidebar__logout" id="sidebar-logout" title="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </aside>

    <!-- MAIN -->
    <main class="lb-main">

      <!-- Top bar with integrated rank chip -->
      <header class="lb-topbar">
        <h1 class="lb-topbar__title">Leaderboard</h1>
        <div class="lb-topbar__right">
          <div class="lb-search">
            <svg class="lb-search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="lb-search-input" class="lb-search__input" placeholder="Search" autocomplete="off" />
          </div>
          <button type="button" class="lb-icon-btn" id="lb-notif-btn" title="Notifications" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <div class="lb-topbar__user" id="lb-topbar-user">
            <div class="lb-topbar__avatar" id="lb-topbar-avatar"></div>
            <div class="lb-topbar__user-info">
              <span class="lb-topbar__name" id="lb-topbar-name">Guest</span>
              <span class="lb-topbar__rank-badge" id="lb-topbar-rank"></span>
            </div>
          </div>
        </div>
      </header>

      <!-- Filter toolbar -->
      <div class="lb-filters">
        <div class="lb-reset-timer" id="lb-reset-timer" title="Daily leaderboard resets at midnight (local time)">
          <svg class="lb-reset-timer__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="lb-reset-timer__label">Resets in</span>
          <span class="lb-reset-timer__value" id="lb-reset-countdown">--:--:--</span>
        </div>
        <div class="lb-tabs" id="lb-timeframe-tabs">
          <button class="lb-tab lb-tab--active" data-timeframe="daily">Today</button>
          <button class="lb-tab" data-timeframe="monthly">This Month</button>
          <button class="lb-tab" data-timeframe="all">All-Time</button>
        </div>
        <div class="lb-dropdown" id="lb-campus-dropdown">
          <button class="lb-dropdown__btn" id="lb-dropdown-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="lb-dropdown__label" id="lb-dropdown-label">Global (All Campuses)</span>
            <svg class="lb-dropdown__arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="lb-dropdown__menu" id="lb-dropdown-menu">
            <button class="lb-dropdown__item lb-dropdown__item--active" type="button" data-value="all">
              <span class="lb-dropdown__dot"></span>
              <span>Global (All Campuses)</span>
            </button>
            <button class="lb-dropdown__item" type="button" data-value="mine">
              <span class="lb-dropdown__dot"></span>
              <span>My Campus Only</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Hero banner podium -->
      <section class="lb-podium-banner" id="lb-podium-banner">
        <div class="lb-podium-banner__stars"></div>
        <div class="lb-podium-banner__planet"></div>
        <div class="lb-podium" id="lb-podium"></div>
      </section>

      <!-- TOP STUDENTS TABLE -->
      <section class="lb-list-section">
        <div class="lb-list-card">
          <div class="lb-list-title">
            <span class="lb-list-title__icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.34"/><path d="M18 14.66V17c0 .55-.45 1-1 1h-2c-.55 0-1-.45-1-1v-2.34"/><path d="M6 9h12a2 2 0 0 1 2 2v1a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-1a2 2 0 0 1 2-2Z"/></svg>
            </span>
            <span>Top Students</span>
          </div>

          <div class="lb-list-header">
            <div class="lb-col lb-col--check"></div>
            <div class="lb-col lb-col--rank">Rank</div>
            <div class="lb-col lb-col--user">User</div>
            <div class="lb-col lb-col--campus">Campus</div>
            <div class="lb-col lb-col--rep">Reputation</div>
            <div class="lb-col lb-col--contrib">Contributions</div>
            <div class="lb-col lb-col--points">Points</div>
            <div class="lb-col lb-col--action"></div>
          </div>

          <div class="lb-list-body" id="lb-list-body"></div>

          <div class="lb-empty" id="lb-empty" style="display: none;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <div class="lb-empty__text"><strong>No recorded activity in this timeframe</strong><br>Answer doubts in the Doubt Pool to earn points!</div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="js/transitions.js"></script>
  <script type="module" src="js/pages/leaderboard.js"></script>
  <script type="module" src="js/cursor.js"></script>
</body>
</html>
