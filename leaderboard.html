<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Studn't</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/leaderboard-v3.css">
</head>
<body class="pd-page">

  <div id="pd-cursor"></div>
  <div id="pd-cursor-glow"></div>

  <!-- Background canvas for subtle space glow and stars -->
  <div class="leaderboard-bg"></div>
  <canvas id="leaderboard-bg-canvas"></canvas>

  <div class="app-shell">

    <!-- ═══ LEFT SIDEBAR ═══ -->
    <aside class="sidebar">
      <a href="index.html" class="sidebar__brand" data-transition>
        <span class="glow-mark__text">?</span>
      </a>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="dashboard.html" title="Dashboard" data-transition>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </a>
        <a class="sidebar__link sidebar__link--active" href="leaderboard.html" title="Leaderboard" data-transition>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.34"/><path d="M18 14.66V17c0 .55-.45 1-1 1h-2c-.55 0-1-.45-1-1v-2.34"/><path d="M6 9h12a2 2 0 0 1 2 2v1a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-1a2 2 0 0 1 2-2Z"/></svg>
        </a>
        <a class="sidebar__link" href="profile.html" title="Profile" data-transition>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
      </nav>
      <div class="sidebar__spacer"></div>
      <div class="sidebar__avatar" id="sidebar-avatar" title="Profile">
        <span id="sidebar-avatar-letter">?</span>
      </div>
      <button class="sidebar__logout" id="sidebar-logout" title="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </aside>

    <!-- ═══ MAIN LEADERBOARD CONTENT ═══ -->
    <main class="lb-main">

      <!-- Header with timeframe filter -->
      <header class="lb-header">
        <div class="lb-header__info">
          <h1 class="lb-header__title">Leaderboard</h1>
        </div>

        <div class="lb-header__controls">
          <!-- Timeframe filter pills -->
          <div class="lb-tabs" id="lb-timeframe-tabs">
            <button class="lb-tab lb-tab--active" data-timeframe="all">All-Time</button>
            <button class="lb-tab" data-timeframe="monthly">This Month</button>
            <button class="lb-tab" data-timeframe="weekly">This Week</button>
          </div>

          <!-- Campus scope filter (Glassmorphism Dropdown) -->
          <div class="lb-dropdown" id="lb-campus-dropdown">
            <button class="lb-dropdown__btn" id="lb-dropdown-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="lb-dropdown__label" id="lb-dropdown-label">Global (All Campuses)</span>
              <svg class="lb-dropdown__arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="lb-dropdown__menu" id="lb-dropdown-menu">
              <button class="lb-dropdown__item lb-dropdown__item--active" type="button" data-value="all">
                <span class="lb-dropdown__dot"></span>
                <span>Global (All Campuses)</span>
              </button>
              <button class="lb-dropdown__item" type="button" data-value="mine">
                <span class="lb-dropdown__dot"></span>
                <span>My Campus Only</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- ═══ TOP 3 PODIUM ═══ -->
      <section class="lb-podium" id="lb-podium">
        <!-- Rendered dynamically via JavaScript: 2nd (left), 1st (center), 3rd (right) -->
      </section>

      <!-- ═══ CURRENT USER POSITION BAR ═══ -->
      <div class="lb-user-bar" id="lb-user-bar" style="display: none;">
        <div class="lb-user-bar__rank">
          <span class="lb-user-bar__rank-label">YOUR RANK</span>
          <span class="lb-user-bar__rank-val" id="user-bar-rank">#—</span>
        </div>
        <div class="lb-user-bar__info">
          <div class="lb-user-bar__name" id="user-bar-name">You</div>
          <div class="lb-user-bar__sub" id="user-bar-sub">Keep helping to climb the leaderboard!</div>
        </div>
        <div class="lb-user-bar__metrics">
          <div class="lb-user-bar__metric">
            <span class="lb-user-bar__metric-label">REPUTATION</span>
            <span class="lb-user-bar__metric-val lb-user-bar__metric-val--orange" id="user-bar-rep">50 REP</span>
          </div>
          <div class="lb-user-bar__metric">
            <span class="lb-user-bar__metric-label">POINTS</span>
            <span class="lb-user-bar__metric-val lb-user-bar__metric-val--blue" id="user-bar-points">0 PTS</span>
          </div>
        </div>
      </div>

      <!-- ═══ RANKINGS LIST / TABLE ═══ -->
      <section class="lb-list-section">
        <div class="lb-list-card">
          <div class="lb-list-header">
            <div class="lb-col lb-col--rank">RANK</div>
            <div class="lb-col lb-col--user">STUDENT</div>
            <div class="lb-col lb-col--campus">CAMPUS / BRANCH</div>
            <div class="lb-col lb-col--rep">REPUTATION</div>
            <div class="lb-col lb-col--contrib">CONTRIBUTIONS</div>
            <div class="lb-col lb-col--points">TOTAL PTS</div>
          </div>

          <div class="lb-list-body" id="lb-list-body">
            <!-- Rendered dynamically -->
          </div>

          <div class="lb-empty" id="lb-empty" style="display: none;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <div class="lb-empty__text"><strong>No recorded activity in this timeframe</strong><br>Answer doubts in the Doubt Pool to earn reputation and points!</div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="js/transitions.js"></script>
  <script type="module" src="js/pages/leaderboard.js"></script>
  <script type="module" src="js/cursor.js"></script>
</body>
</html>
